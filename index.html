<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pilot Construction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0A0A0A;--panel:#0D0D0D;--panel2:#111111;
  --yellow:#F5C518;--red:#E4572E;--green:#3DBE7A;
  --text:#EDEDED;--sub:#8A8A8A;--muted:#6E6E6E;
  --div2:#2E2E2E;--div1:#1E1E1E;
  --tab-h:58px;--bottom-pad:94px;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:'DM Sans',sans-serif;font-size:14px}

/* ── SHELL ───────────────────────────────────────────────────── */
.app{display:flex;flex-direction:column;height:100%}
.top-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;height:48px;border-bottom:1px solid var(--div1);
  flex-shrink:0;
}
.top-brand{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;color:var(--yellow)}
.top-date{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted)}

.screens{flex:1;overflow:hidden;position:relative}
.screen{
  position:absolute;inset:0;overflow-y:auto;
  padding-bottom:var(--bottom-pad);
  display:none;
  -webkit-overflow-scrolling:touch;
}
.screen.active{display:block}

/* ── TAB BAR ────────────────────────────────────────────────── */
.tab-bar{
  position:fixed;bottom:0;left:0;right:0;height:var(--tab-h);
  background:var(--panel);border-top:2px solid var(--div2);
  display:flex;z-index:100;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.tab-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;background:none;border:none;cursor:pointer;
  font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);
  position:relative;min-height:44px;
}
.tab-btn.active{color:var(--yellow)}
.tab-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tab-badge{
  position:absolute;top:6px;right:calc(50% - 14px);
  background:var(--yellow);color:#000;
  font-family:'DM Mono',monospace;font-size:8px;font-weight:700;
  padding:1px 4px;min-width:16px;text-align:center;
  border-radius:0;
}

/* ── SECTION HELPERS ────────────────────────────────────────── */
.sec-pad{padding:20px 20px 0}
.sec-label{
  font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);
  letter-spacing:1.2px;text-transform:uppercase;
  padding-bottom:10px;border-bottom:1px solid var(--div1);margin-bottom:14px;
}
.divider{height:1px;background:var(--div2);margin:20px 0}

/* ── SCREEN A: MONEY ─────────────────────────────────────────── */
.hero-block{
  padding:28px 20px 20px;border-bottom:2px solid var(--div2);
}
.hero-label{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);margin-bottom:6px;letter-spacing:1px}
.hero-val{font-family:'Bebas Neue',sans-serif;font-size:68px;line-height:1;color:var(--yellow)}
.hero-bar{display:flex;height:6px;gap:2px;margin-top:16px}
.hero-bar-collected{background:var(--green)}
.hero-bar-open{background:var(--div2)}
.hero-bar-label{display:flex;justify-content:space-between;margin-top:6px;
  font-family:'DM Mono',monospace;font-size:9px;color:var(--muted)}

.stat-row{
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--div1);
  border-bottom:2px solid var(--div2);
}
.stat-cell{background:var(--panel);padding:14px 12px}
.stat-label{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.8px}
.stat-val{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--text)}

/* Attention rows */
.attn-list{display:flex;flex-direction:column;gap:1px}
.attn-row{
  display:flex;align-items:stretch;background:var(--panel);min-height:56px;
}
.attn-bar{width:4px;flex-shrink:0}
.attn-bar.yellow{background:var(--yellow)}
.attn-bar.red{background:var(--red)}
.attn-bar.green{background:var(--green)}
.attn-body{flex:1;padding:12px 14px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.attn-job{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted)}
.attn-text{font-size:11px;color:var(--sub);margin-top:2px;line-height:1.4}
.attn-text strong{color:var(--text)}
.attn-fig{padding:12px 14px 12px 0;font-family:'Bebas Neue',sans-serif;font-size:20px;
  display:flex;align-items:center;white-space:nowrap}
.attn-fig.yellow{color:var(--yellow)}
.attn-fig.red{color:var(--red)}
.attn-fig.green{color:var(--green)}

/* CTA */
.cta-btn{
  display:flex;align-items:center;justify-content:space-between;
  margin:16px 20px;padding:0 20px;height:52px;
  background:var(--yellow);color:#000;
  font-family:'DM Mono',monospace;font-size:11px;font-weight:700;
  border:none;cursor:pointer;width:calc(100% - 40px);
}
.cta-arrow{font-size:16px}

/* ── SCREEN B: JOBS ──────────────────────────────────────────── */
.jobs-filter{
  display:flex;gap:0;padding:0 20px;border-bottom:1px solid var(--div1);
  overflow-x:auto;-webkit-overflow-scrolling:touch;
}
.jobs-filter::-webkit-scrollbar{display:none}
.jf-tab{
  padding:12px 14px;font-family:'DM Mono',monospace;font-size:9px;
  color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;
  white-space:nowrap;cursor:pointer;flex-shrink:0;
}
.jf-tab.active{color:var(--yellow);border-bottom-color:var(--yellow)}

.job-card{
  display:flex;align-items:stretch;background:var(--panel);
  border-bottom:1px solid var(--div1);min-height:64px;
}
.job-card-bar{width:4px;flex-shrink:0}
.job-card-bar.green{background:var(--green)}
.job-card-bar.yellow{background:var(--yellow)}
.job-card-bar.red{background:var(--red)}
.job-card-body{flex:1;padding:12px 14px;min-width:0}
.job-card-code{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted)}
.job-card-name{font-size:12px;color:var(--text);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job-card-bars{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.mini-bar-row{display:flex;align-items:center;gap:8px}
.mini-bar-label{font-family:'DM Mono',monospace;font-size:8px;color:var(--muted);width:28px;text-align:right;flex-shrink:0}
.mini-bar-track{flex:1;height:4px;background:var(--div1);position:relative}
.mini-bar-fill{position:absolute;top:0;left:0;height:100%}
.mini-bar-fill.green{background:var(--green)}
.mini-bar-fill.yellow{background:var(--yellow)}
.mini-bar-fill.red{background:var(--red)}
.mini-bar-pct{font-family:'DM Mono',monospace;font-size:8px;width:30px;flex-shrink:0}
.mini-bar-pct.green{color:var(--green)}
.mini-bar-pct.yellow{color:var(--yellow)}
.mini-bar-pct.red{color:var(--red)}

/* ── SCREEN C: INVOICES ──────────────────────────────────────── */
.inv-tabs{
  display:flex;gap:0;overflow-x:auto;-webkit-overflow-scrolling:touch;
  border-bottom:2px solid var(--div2);
}
.inv-tabs::-webkit-scrollbar{display:none}
.inv-tab{
  padding:12px 14px;font-family:'DM Mono',monospace;font-size:9px;
  color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;
  white-space:nowrap;cursor:pointer;flex-shrink:0;margin-bottom:-2px;
}
.inv-tab.active{color:var(--yellow);border-bottom-color:var(--yellow)}

.inv-total{
  font-family:'Bebas Neue',sans-serif;font-size:36px;padding:16px 20px 8px;
}

.inv-filter-chips{
  display:flex;gap:8px;padding:0 20px 16px;overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}
.inv-filter-chips::-webkit-scrollbar{display:none}
.chip{
  padding:5px 10px;font-family:'DM Mono',monospace;font-size:9px;
  border:1px solid var(--div2);color:var(--muted);background:none;cursor:pointer;white-space:nowrap;flex-shrink:0;
}
.chip.active{border-color:var(--yellow);color:var(--yellow)}

.inv-row{
  display:flex;align-items:stretch;border-bottom:1px solid var(--div1);
  background:var(--panel);min-height:56px;
}
.inv-row-bar{width:3px;flex-shrink:0}
.inv-row-bar.pending{background:var(--yellow)}
.inv-row-bar.hold{background:var(--red)}
.inv-row-bar.received{background:var(--green)}
.inv-row-bar.approved{background:#5B8DEF}
.inv-row-bar.paid{background:var(--muted)}
.inv-row-bar.void{background:var(--div2)}
.inv-row-body{flex:1;padding:10px 14px;min-width:0}
.inv-vendor{font-size:12px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inv-meta{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);margin-top:3px}
.inv-amt{padding:10px 14px 10px 0;font-family:'DM Mono',monospace;font-size:12px;
  display:flex;align-items:center;white-space:nowrap;color:var(--text)}
.hold-age{font-family:'DM Mono',monospace;font-size:8px;color:var(--red)}

.show-more-btn{
  display:block;width:calc(100% - 40px);margin:16px 20px;
  padding:14px;text-align:center;background:none;
  border:1px solid var(--div2);color:var(--sub);
  font-family:'DM Mono',monospace;font-size:10px;cursor:pointer;
}
.show-more-btn:active{border-color:var(--yellow);color:var(--yellow)}

/* ── SCREEN D: FIELD ─────────────────────────────────────────── */
.empty{padding:60px 20px;text-align:center;font-family:'DM Mono',monospace;font-size:11px;color:var(--muted)}
</style>
</head>

<div class="app">
  <div class="top-bar">

    <div class="top-date" id="top-date"></div>
  </div>

  <div class="screens">

    <!-- ── SCREEN A: MONEY ─────────────────────────────────── -->
    <div class="screen active" id="screen-money">
      <div class="hero-block">
        <div class="hero-label">Outstanding</div>
        <div class="hero-val" id="hero-outstanding"></div>
        <div class="hero-bar">
          <div class="hero-bar-collected" id="hero-bar-collected"></div>
          <div class="hero-bar-open" id="hero-bar-open"></div>
        </div>
        <div class="hero-bar-label">
          <span id="hero-collected-label"></span>
          <span id="hero-open-label"></span>
        </div>
      </div>

      <div class="stat-row">
        <div class="stat-cell">
          <div class="stat-label">Contract</div>
          <div class="stat-val" id="stat-contract"></div>
        </div>
        <div class="stat-cell">
          <div class="stat-label">Cost</div>
          <div class="stat-val" id="stat-cost"></div>
        </div>
        <div class="stat-cell">
          <div class="stat-label">Active</div>
          <div class="stat-val" id="stat-active"></div>
        </div>
      </div>

      <div class="sec-pad" style="margin-top:20px">
        <div class="sec-label">Needs Attention</div>
        <div id="m-attn-list" class="attn-list"></div>
      </div>

      <button class="cta-btn" id="cta-invoices" onclick="switchTab('invoices')">
        <span id="cta-text"></span>
        <span class="cta-arrow">→</span>
      </button>
    </div>

    <!-- ── SCREEN B: JOBS ──────────────────────────────────── -->
    <div class="screen" id="screen-jobs">
      <div class="jobs-filter">
        <button class="jf-tab active" onclick="filterMJobs('active',this)">Active</button>
        <button class="jf-tab" onclick="filterMJobs('closing',this)">Closing</button>
        <button class="jf-tab" onclick="filterMJobs('all',this)">All</button>
      </div>
      <div id="m-jobs-list"></div>
    </div>

    <!-- ── SCREEN C: INVOICES ──────────────────────────────── -->
    <div class="screen" id="screen-invoices">
      <div class="inv-tabs" id="inv-tabs">
        <button class="inv-tab active" onclick="switchInvTab('pending',this)">Pending <span id="m-cnt-pending"></span></button>
        <button class="inv-tab" onclick="switchInvTab('hold',this)">On Hold <span id="m-cnt-hold"></span></button>
        <button class="inv-tab" onclick="switchInvTab('received',this)">Received <span id="m-cnt-received"></span></button>
        <button class="inv-tab" onclick="switchInvTab('paid',this)">Paid <span id="m-cnt-paid"></span></button>
      </div>
      <div class="inv-total" id="m-inv-total"></div>
      <div class="inv-filter-chips" id="inv-chips"></div>
      <div id="m-inv-list"></div>
      <button class="show-more-btn" id="m-show-more" onclick="showMoreInv()"></button>
    </div>

    <!-- ── SCREEN D: FIELD ─────────────────────────────────── -->
    <div class="screen" id="screen-field">
      <div class="empty">Field tracking — next update</div>
    </div>

  </div><!-- /screens -->

  <!-- ── TAB BAR ────────────────────────────────────────────── -->
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('money')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9 10h4.5a1.5 1.5 0 010 3H9.5a1.5 1.5 0 000 3H14"/></svg>
      Money
    </button>
    <button class="tab-btn" onclick="switchTab('jobs')">
      <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/></svg>
      Jobs
    </button>
    <button class="tab-btn" onclick="switchTab('invoices')" id="tab-invoices">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg>
      Invoices
    </button>
    <button class="tab-btn" onclick="switchTab('field')">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
      Field
    </button>
  </div>
</div>

<script>
// ── UTILS ─────────────────────────────────────────────────────
const fmtM = n => '$'+(Math.abs(n)/1e6).toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1})+'M';
const fmtK = n => '$'+(Math.abs(n)/1e3).toLocaleString('en-US',{maximumFractionDigits:0})+'K';
const fmt  = n => '$'+Math.abs(n).toLocaleString('en-US',{maximumFractionDigits:0});
const pct  = (a,b) => b ? Math.round(a/b*100) : 0;

// ── TAB SWITCHING ─────────────────────────────────────────────
const screens = {money:'screen-money',jobs:'screen-jobs',invoices:'screen-invoices',field:'screen-field'};
let currentTab = 'money';
function switchTab(name) {
  currentTab = name;
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById(screens[name]).classList.add('active');
  document.querySelectorAll('.tab-btn')[['money','jobs','invoices','field'].indexOf(name)].classList.add('active');
  if(name==='invoices') renderMInv();
  if(name==='jobs') renderMJobs();
}

// ── MONEY SCREEN ──────────────────────────────────────────────
function buildMoney() {
  const contract   = JOBS.reduce((s,j)=>s+(j.contract||0),0);
  const cost       = JOBS.reduce((s,j)=>s+(j.costBooks||0),0);
  const invoiced   = JOBS.reduce((s,j)=>s+(j.invoiced||0),0);
  const payments   = JOBS.reduce((s,j)=>s+(j.payments||0),0);
  const outstanding = invoiced - payments;
  const collPct    = pct(payments, invoiced);
  const active     = JOBS.filter(j=>(j.advance||0)>0&&(j.advance||0)<100).length;

  document.getElementById('top-date').textContent =
    new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});

  document.getElementById('hero-outstanding').textContent = fmtM(outstanding);
  document.getElementById('hero-bar-collected').style.flex = collPct;
  document.getElementById('hero-bar-open').style.flex = 100-collPct;
  document.getElementById('hero-collected-label').textContent = `${fmtM(payments)} collected`;
  document.getElementById('hero-open-label').textContent = `${100-collPct}% open`;

  document.getElementById('stat-contract').textContent = fmtM(contract);
  document.getElementById('stat-cost').textContent = fmtM(cost);
  document.getElementById('stat-active').textContent = active + ' jobs';

  // Attention rows
  const rows = [];
  const byOwed = [...JOBS].sort((a,b)=>((b.invoiced||0)-(b.payments||0))-((a.invoiced||0)-(a.payments||0)));
  const top1 = byOwed[0];
  if(top1) {
    const owed = (top1.invoiced||0)-(top1.payments||0);
    if(owed > 1000000) {
      const c = pct(top1.payments||0, top1.invoiced||0);
      rows.push({color:'yellow',job:top1.job,text:`<strong>${fmtM(owed)}</strong> outstanding — ${c}% collected`,fig:fmtM(owed),figColor:'yellow'});
    }
  }
  const earlyOver = JOBS.filter(j=>(j.costBooks||0)>(j.finalBudget||0)&&(j.advance||0)<50&&(j.finalBudget||0)>0);
  earlyOver.slice(0,2).forEach(j=>{
    const over=pct((j.costBooks||0)-(j.finalBudget||0),j.finalBudget||0);
    rows.push({color:'red',job:j.job,text:`Over budget <strong>+${over}%</strong> at ${Math.round(j.advance||0)}% complete`,fig:`+${over}%`,figColor:'red'});
  });
  const northridge = JOBS.filter(j=>{const m=j.job&&j.job.match(/^22-(\d+)$/);return m&&parseInt(m[1])>=3&&parseInt(m[1])<=11;});
  if(northridge.length) {
    const nOwed = northridge.reduce((s,j)=>s+(j.invoiced||0)-(j.payments||0),0);
    rows.push({color:'green',job:`${northridge.length} units`,text:`Northridge — <strong>${fmtM(nOwed)}</strong> outstanding`,fig:fmtM(nOwed),figColor:'green'});
  }

  document.getElementById('m-attn-list').innerHTML = rows.slice(0,4).map(r=>`
    <div class="attn-row">
      <div class="attn-bar ${r.color}"></div>
      <div class="attn-body">
        <div class="attn-job">${r.job}</div>
        <div class="attn-text">${r.text}</div>
      </div>
      <div class="attn-fig ${r.figColor}">${r.fig}</div>
    </div>
  `).join('');

  // CTA
  const pendingTotal = INV_PENDING.reduce((s,i)=>s+(i.amount||0),0);
  document.getElementById('cta-text').textContent = `${INV_PENDING.length} invoices pending · ${fmtK(pendingTotal)}`;

  // Badge
  const badge = document.getElementById('tab-invoices');
  const pending = INV_PENDING.length;
  if(pending > 0) {
    const b = document.createElement('div');
    b.className='tab-badge';
    b.textContent = pending > 99 ? '99+' : pending;
    badge.appendChild(b);
  }
}

// ── JOBS SCREEN ───────────────────────────────────────────────
let mJobFilter = 'active';
function filterMJobs(f, el) {
  mJobFilter = f;
  document.querySelectorAll('.jf-tab').forEach(t=>t.classList.remove('active'));
  if(el) el.classList.add('active');
  renderMJobs();
}

function renderMJobs() {
  let jobs = [...JOBS];
  if(mJobFilter==='active') jobs=jobs.filter(j=>(j.advance||0)>0&&(j.advance||0)<100);
  if(mJobFilter==='closing') jobs=jobs.filter(j=>(j.advance||0)>=100);
  jobs.sort((a,b)=>(b.costBooks||0)-(a.costBooks||0));

  document.getElementById('m-jobs-list').innerHTML = jobs.map(j=>{
    const budget=j.finalBudget||0;const cost=j.costBooks||0;const inv=j.invoiced||0;const pay=j.payments||0;
    const costPct=budget>0?cost/budget*100:0;const collPct=inv>0?pay/inv*100:0;
    const costColor=costPct<60?'green':costPct<=100?'yellow':'red';
    const collColor=collPct>=70?'green':collPct>=40?'yellow':'red';
    return `<div class="job-card">
      <div class="job-card-bar ${costColor}"></div>
      <div class="job-card-body">
        <div class="job-card-code">${j.job}</div>
        <div class="job-card-name">${j.name}</div>
        <div class="job-card-bars">
          <div class="mini-bar-row">
            <div class="mini-bar-label">Cost</div>
            <div class="mini-bar-track"><div class="mini-bar-fill ${costColor}" style="width:${Math.min(costPct,100)}%"></div></div>
            <div class="mini-bar-pct ${costColor}">${Math.round(costPct)}%</div>
          </div>
          <div class="mini-bar-row">
            <div class="mini-bar-label">Coll</div>
            <div class="mini-bar-track"><div class="mini-bar-fill ${collColor}" style="width:${Math.min(collPct,100)}%"></div></div>
            <div class="mini-bar-pct ${collColor}">${Math.round(collPct)}%</div>
          </div>
        </div>
      </div>
      <div style="padding:12px;font-family:'DM Mono',monospace;font-size:10px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:4px">
        <div style="color:var(--sub)">${fmtK(budget)}</div>
        <div style="color:var(--muted);font-size:9px">${Math.round(j.advance||0)}% done</div>
      </div>
    </div>`;
  }).join('');
}

// ── INVOICES SCREEN ───────────────────────────────────────────
let mInvStatus = 'pending';
let mInvJobFilter = 'all';
let mInvShowing = 25;
const M_INV_MAP = {
  pending: ()=>INV_PENDING,
  hold:    ()=>INV_HOLD,
  received:()=>INV_RECEIVED,
  paid:    ()=>INV_PAID,
};

function switchInvTab(status, el) {
  mInvStatus = status;
  mInvJobFilter = 'all';
  mInvShowing = 25;
  document.querySelectorAll('.inv-tab').forEach(t=>t.classList.remove('active'));
  if(el) el.classList.add('active');
  renderMInv();
}

function showMoreInv() {
  mInvShowing += 25;
  renderMInv();
}

function setInvJob(job, el) {
  mInvJobFilter = job;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  if(el) el.classList.add('active');
  mInvShowing = 25;
  renderMInv();
}

function renderMInv() {
  const all = (M_INV_MAP[mInvStatus]||(()=>[]))();

  // Build job chips
  const jobs = [...new Set(all.map(i=>i.job).filter(Boolean))].sort();
  document.getElementById('inv-chips').innerHTML =
    `<button class="chip${mInvJobFilter==='all'?' active':''}" onclick="setInvJob('all',this)">All</button>`
    + jobs.map(j=>`<button class="chip${mInvJobFilter===j?' active':''}" onclick="setInvJob('${j}',this)">${j}</button>`).join('');

  let filtered = mInvJobFilter==='all' ? all : all.filter(i=>i.job===mInvJobFilter);
  const total = filtered.reduce((s,i)=>s+(i.amount||0),0);
  document.getElementById('m-inv-total').textContent = fmt(total);

  const showing = filtered.slice(0, mInvShowing);
  const now = Date.now();
  document.getElementById('m-inv-list').innerHTML = showing.map(inv=>{
    let ageStr = '';
    if(mInvStatus==='hold' && inv.date) {
      const p=inv.date.split('/');
      if(p.length===3){const d=new Date(parseInt(p[2]),parseInt(p[0])-1,parseInt(p[1]));
        const mo=Math.round((now-d.getTime())/(1000*60*60*24*30));
        if(mo>0) ageStr=`<span class="hold-age"> · ON HOLD ${mo}MO</span>`;}
    }
    return `<div class="inv-row">
      <div class="inv-row-bar ${mInvStatus}"></div>
      <div class="inv-row-body">
        <div class="inv-vendor">${inv.vendor||''}</div>
        <div class="inv-meta">#${inv.inv||'—'} · ${inv.job||''} · ${inv.date||''}${ageStr}</div>
      </div>
      <div class="inv-amt">${fmt(inv.amount||0)}</div>
    </div>`;
  }).join('');

  const showMoreBtn = document.getElementById('m-show-more');
  if(filtered.length > mInvShowing) {
    showMoreBtn.style.display='block';
    showMoreBtn.textContent=`Show ${Math.min(25, filtered.length-mInvShowing)} more of ${filtered.length-mInvShowing} remaining`;
  } else {
    showMoreBtn.style.display='none';
  }

  // Update counts
  document.getElementById('m-cnt-pending').textContent=`(${INV_PENDING.length})`;
  document.getElementById('m-cnt-hold').textContent=`(${INV_HOLD.length})`;
  document.getElementById('m-cnt-received').textContent=`(${INV_RECEIVED.length})`;
  document.getElementById('m-cnt-paid').textContent=`(${INV_PAID.length})`;
}

// ── INIT ─────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', ()=>{
  buildMoney();
  renderMJobs();
  renderMInv();
});
</script>
